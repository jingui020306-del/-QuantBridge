[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "quantbridge"
version = "0.1.0"
description = "QuantBridge — Quantitative strategy pipeline bridging FinceptTerminal, alphalens, LEAN, and pyfolio"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "jingui020306"}]

[project.scripts]
quantbridge = "quantbridge.pipeline:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1"]

[tool.setuptools.packages.find]
include = ["quantbridge*"]
