# ============================================================
# QuantBridge 默认配置文件
# 复制此文件为 custom.yaml，修改后通过 --config custom.yaml 使用
# ============================================================

general:
  project_name: "default"
  output_dir: "outputs"
  log_level: "INFO"

daemon:
  watch_dir: "outputs/watch"
  runtime_dir: "outputs/runtime"
  poll_interval_seconds: 300
  # 只监听显式触发文件，避免 heartbeat/state/signals 输出造成自触发。
  trigger_patterns:
    - "trigger_*.json"
    - "strategy_*.json"
    - "strategy_*.yaml"
    - "strategy_*.yml"
    - "params_*.json"
    - "params_*.yaml"
    - "params_*.yml"

data:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
    - TSLA
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  frequency: "1d"          # 1d / 1h / 30m
  cache_dir: "outputs/cache"
  # 可选：从 FinceptTerminal 导出的 CSV 路径读取数据
  fincept_export_path: null

factors:
  # FinceptTerminal 脚本目录（预留集成点；当前默认因子由 QuantBridge 内置计算）
  fincept_scripts_dir: "/tmp/FinceptTerminal/fincept-qt/scripts"
  # 自定义因子列表（为空则用默认技术指标组合）
  custom_factors: []
  # 默认因子的计算参数
  default_params:
    rsi_window: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    ma_windows: [5, 9, 21, 50, 200]
    volatility_window: 20
    momentum_windows: [5, 21, 63, 126]

alphalens:
  forward_periods: [1, 5, 21]  # 未来 1/5/21 天的收益
  quantiles: 5                  # 分层数量
  periods_per_year: 252
  # 通过标准
  pass_threshold:
    min_ic_mean: 0.02           # IC 均值绝对值 > 0.02
    min_icir: 0.3               # ICIR > 0.3
    min_quantile_spread: 0.005  # 顶底层日均收益差 > 0.5bp

backtest:
  engine: "lean"                # 当前 lean 模式会在 Docker 集成不可用时降级为简易回测
  lean:
    docker_image: "quantconnect/lean:latest"
    # 数据目录挂载
    data_dir: "outputs/lean_data"
    # 回测参数
    start_date: "2022-01-01"
    end_date: "2024-12-31"
    cash: 100000                # 初始资金
    commission: 0.001           # 手续费率
    slippage: 0.001             # 滑点
    resolution: "daily"         # daily / minute
    # 策略类型
    strategy_type: "ema_cross"  # ema_cross / rsi_reversal / factor_rotation / custom
    strategy_params:
      fast_period: 9
      slow_period: 21
    # 风控
    risk:
      max_position_pct: 0.25
      stop_loss_pct: 0.05
      max_daily_loss_pct: 0.03

pyfolio:
  benchmark: "SPY"
  periods_per_year: 252

fincept:
  enabled: true
  # 当前仅支持 file：QuantBridge 写 signals.json / trigger 文件。
  # native 需要在 FinceptTerminal 本体增加读取 signals / 写 trigger 的入口后再启用。
  integration_mode: "file"
  # FinceptTerminal 安装路径
  fincept_home: "/tmp/FinceptTerminal"
  # 启动时自动执行的任务
  on_launch:
    - refresh_data
    - compute_factors
  # QuantBridge 信号快照；FinceptTerminal 原生读取需要额外桥接
  signal_output: "outputs/signals.json"
  # QuantBridge 报告目录
  report_output: "outputs/reports"

dashboard:
  port: 8501
  auto_open: true
